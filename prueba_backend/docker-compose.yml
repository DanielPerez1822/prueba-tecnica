version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financiera_postgres
    restart: always
    environment:
      POSTGRES_DB: financiera_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
